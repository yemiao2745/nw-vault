# NodeWarden 上游自动同步（模板）
#
# 这是模板，由 setup.mjs 渲染后提交进 fork 的 .github/workflows/sync-upstream.yml。
# 占位符（提交进 fork 的那份里不会再留下占位符）：
#   shuaiplus/nodewarden   ← nodewarden.config.json 的 github.upstream
#   main     ← 固定 main
#
# 做什么：每天把上游 main 合并进 fork 的 main。合并产生新提交 → Cloudflare Workers Builds
# 收到 push → 自动重新构建部署。
#
# 为什么跟 main 而不是跟发布标签：上游把安全修复和客户端兼容修复直接推进 main，
# 发布标签经常落后很多提交（实测 v1.8.0 落后 main 23 个提交，其中包含 PostCSS 路径穿越
# 修复、备份凭据泄漏修复、Bitwarden 客户端兼容修复）。上游仓库自己推荐的做法
# （Sync fork → Update branch）跟的也是 main。
#
# 定时任务的坑：仓库连续约 60 天没有任何活动时，GitHub 会自动停用 schedule 触发器。
# 恢复办法：在仓库 Actions 页面手动跑一次这个 workflow（workflow_dispatch），
# 对仓库做任何一次 push 也会重置计时。

name: Sync upstream main

on:
  schedule:
    # 每天 UTC 03:29（北京时间 11:29）。避开整点：0 分和 30 分最容易排队或被丢弃。
    - cron: "29 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure bot identity
        run: |
          git config user.name "nodewarden-sync-bot"
          git config user.email "nodewarden-sync-bot@users.noreply.github.com"

      - name: Sync with upstream
        run: |
          set -euo pipefail
          # 必须是 merge，不能用 reset --hard 对齐上游：
          # 本文件（.github/workflows/sync-upstream.yml）只存在于 fork 里，上游没有它，
          # 一旦强推对齐就把它自己删掉，自动同步随之静默失效。
          git remote add upstream https://github.com/shuaiplus/nodewarden.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "已是上游最新，无需同步。"
            exit 0
          fi

          git merge --no-edit upstream/main
          git push origin "HEAD:main"
          echo "已同步上游 main，Cloudflare Workers Builds 会自动开始构建。"

      # 合并冲突时上面这步会以非 0 退出码失败（默认行为，故意不做自动冲突解决）：
      # GitHub 会发通知给你，请自己打开仓库处理冲突后再让 workflow 重跑。
